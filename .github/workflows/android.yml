name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The app has a "plan" flavor dimension (personal/store), so variant tasks
      # are named per flavor: assembleDebug does not exist.
      - name: Run tests and assemble debug APKs
        run: ./gradlew testPersonalDebugUnitTest testStoreDebugUnitTest assemblePersonalDebug assembleStoreDebug
